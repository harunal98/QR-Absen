<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Absensi Siswa</title>
    <!-- Library QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Pola background transparent blueprint grid */
        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
        
        /* CSS Tambahan untuk membersihkan UI bawaan html5-qrcode */
        #reader {
            border: none !important;
            background: transparent !important;
        }
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_swaplink {
            color: #cbd5e1 !important; 
            text-decoration: none !important;
            margin-bottom: 10px;
            display: inline-block;
        }
        #reader button {
            background: #f8fafc !important;
            border: 1px solid #cbd5e1 !important;
            color: #334155 !important;
            padding: 8px 16px !important;
            border-radius: 9999px !important;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            margin: 5px;
            font-size: 0.875rem;
        }
        #reader button:hover {
            background: #e2e8f0 !important;
        }
        #reader a {
            color: #94a3b8 !important; 
        }
        #reader video {
            border-radius: 1rem !important;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-slate-50 border border-slate-200 shadow-lg p-8 rounded-3xl w-full max-w-md flex flex-col items-center">
        
        <h1 class="text-3xl font-bold mb-1 text-slate-800 tracking-tight">Absensi<span class="text-cyan-600">QR</span></h1>
        <p class="text-slate-500 text-sm mb-8 font-light">Sistem Presensi Digital Terpadu</p>
        
        <!-- Frame Kamera -->
        <div class="w-full mb-6 p-2 rounded-2xl bg-white border border-slate-200 shadow-inner">
            <div id="reader" class="w-full overflow-hidden rounded-xl"></div>
        </div>
        
        <!-- Area Hasil Notifikasi bergaya Glass -->
        <div id="result" class="w-full h-14 flex items-center justify-center px-4 rounded-xl border border-slate-200 bg-white text-slate-600 font-medium transition-all duration-300 shadow-sm">
            Kamera siap digunakan...
        </div>
        
    </div>

    <script>
        // URL Web App kamu
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYBxiWJj5S6xjbTKAouPFaO9eHfhJygGAFj9pXdHS56TpVs2xU02luC8cqW3A2R5TP/exec";

        let isScanning = false;

        function updateResultUI(message, state) {
            const resultDiv = document.getElementById('result');
            
            // Kelas dasar untuk tata letak dan efek kaca
            let baseClasses = "w-full h-14 flex items-center justify-center px-4 rounded-xl shadow-sm font-medium transition-all duration-300 border ";
            
            if (state === 'loading') {
                resultDiv.className = baseClasses + "bg-amber-100 border-amber-300 text-amber-700";
            } else if (state === 'success') {
                resultDiv.className = baseClasses + "bg-emerald-100 border-emerald-300 text-emerald-700";
            } else if (state === 'error') {
                resultDiv.className = baseClasses + "bg-rose-100 border-rose-300 text-rose-700";
            } else { 
                resultDiv.className = baseClasses + "bg-white border-slate-200 text-slate-600";
            }
            
            resultDiv.innerHTML = message;
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isScanning) return; 
            isScanning = true;
            
            updateResultUI(`<span class="animate-pulse">Memproses NIS: ${decodedText}...</span>`, 'loading');

            fetch(`${SCRIPT_URL}?nis=${decodedText}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        updateResultUI(`✅ ${data.message}`, 'success');
                    } else {
                        updateResultUI(`❌ ${data.message}`, 'error');
                    }
                    
                    setTimeout(() => {
                        updateResultUI("Kamera siap digunakan...", 'default');
                        isScanning = false;
                    }, 3500);
                })
                .catch(error => {
                    updateResultUI(`⚠️ Gagal menghubungi server!`, 'error');
                    setTimeout(() => {
                        updateResultUI("Kamera siap digunakan...", 'default');
                        isScanning = false;
                    }, 3500);
                });
        }

        function onScanFailure(error) {
            // Mengabaikan error render frame bawaan library
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { 
                fps: 10, 
                qrbox: {width: 250, height: 250},
                supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
            },
            false);
            
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
