<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Absensi Siswa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Library QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ink: #172033;
            --muted: #64748b;
            --line: rgba(148, 163, 184, 0.26);
            --glass: rgba(255, 255, 255, 0.74);
            --accent: #0891b2;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background: #ffffff;
            color: var(--ink);
        }
        .glass-panel {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.92);
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12), 0 2px 10px rgba(15, 23, 42, 0.05);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }
        .camera-frame {
            background: rgba(248, 250, 252, 0.82);
            border: 1px solid var(--line);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }
        #reader {
            border: none !important;
            background: transparent !important;
        }
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_swaplink {
            color: var(--muted) !important;
            text-decoration: none !important;
            margin-bottom: 10px;
            display: inline-block;
        }
        #reader button {
            background: rgba(255, 255, 255, 0.8) !important;
            border: 1px solid #cbd5e1 !important;
            color: #334155 !important;
            padding: 8px 16px !important;
            border-radius: 9999px !important;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            margin: 5px;
            font-size: 0.875rem;
        }
        #reader button:hover {
            background: #ecfeff !important;
            border-color: #67e8f9 !important;
            color: #0e7490 !important;
        }
        #reader a {
            color: #64748b !important;
        }
        #reader video {
            border-radius: 1rem !important;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.75);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="glass-panel p-7 sm:p-8 rounded-[2rem] w-full max-w-md flex flex-col items-center">
        
        <div class="w-full flex items-start justify-between mb-7">
            <div>
                <p class="text-cyan-700 text-xs font-bold uppercase tracking-[0.18em] mb-2">Presensi digital</p>
                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Absensi<span class="text-cyan-600">QR</span></h1>
            </div>
            <div class="w-10 h-10 rounded-2xl bg-cyan-50 border border-cyan-100 flex items-center justify-center text-cyan-600">
                <svg aria-hidden="true" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="4" y="4" width="6" height="6" rx="1"></rect>
                    <rect x="14" y="4" width="6" height="6" rx="1"></rect>
                    <rect x="4" y="14" width="6" height="6" rx="1"></rect>
                    <path d="M14 14h3v3h-3zM17 17h3M14 20h3"></path>
                </svg>
            </div>
        </div>
        <p class="w-full text-slate-500 text-sm mb-6">Arahkan kamera ke QR Code siswa untuk mencatat kehadiran.</p>
        
        <div class="camera-frame w-full mb-5 p-2 rounded-2xl">
            <div id="reader" class="w-full overflow-hidden rounded-xl"></div>
        </div>
        
        <div id="result" class="w-full min-h-14 flex items-center justify-center px-4 py-3 rounded-2xl border border-slate-200/80 bg-white/70 text-slate-600 text-sm font-semibold text-center transition-all duration-300 shadow-sm">
            Kamera siap digunakan...
        </div>
        
    </main>

    <script>
        // URL Web App kamu
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYBxiWJj5S6xjbTKAouPFaO9eHfhJygGAFj9pXdHS56TpVs2xU02luC8cqW3A2R5TP/exec";

        let isScanning = false;

        function updateResultUI(message, state) {
            const resultDiv = document.getElementById('result');
            
            // Kelas dasar untuk tata letak dan efek kaca
            let baseClasses = "w-full min-h-14 flex items-center justify-center px-4 py-3 rounded-2xl shadow-sm font-semibold text-sm text-center transition-all duration-300 border ";
            
            if (state === 'loading') {
                resultDiv.className = baseClasses + "bg-amber-50 border-amber-200 text-amber-700";
            } else if (state === 'success') {
                resultDiv.className = baseClasses + "bg-emerald-50 border-emerald-200 text-emerald-700";
            } else if (state === 'error') {
                resultDiv.className = baseClasses + "bg-rose-50 border-rose-200 text-rose-700";
            } else { 
                resultDiv.className = baseClasses + "bg-white/70 border-slate-200/80 text-slate-600";
            }
            
            resultDiv.innerHTML = message;
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isScanning) return; 
            isScanning = true;
            
            updateResultUI(`<span class="animate-pulse">Memproses NIS: ${decodedText}...</span>`, 'loading');

            fetch(`${SCRIPT_URL}?nis=${decodedText}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        updateResultUI(`✅ ${data.message}`, 'success');
                    } else {
                        updateResultUI(`❌ ${data.message}`, 'error');
                    }
                    
                    setTimeout(() => {
                        updateResultUI("Kamera siap digunakan...", 'default');
                        isScanning = false;
                    }, 3500);
                })
                .catch(error => {
                    updateResultUI(`⚠️ Gagal menghubungi server!`, 'error');
                    setTimeout(() => {
                        updateResultUI("Kamera siap digunakan...", 'default');
                        isScanning = false;
                    }, 3500);
                });
        }

        function onScanFailure(error) {
            // Mengabaikan error render frame bawaan library
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { 
                fps: 10, 
                qrbox: {width: 250, height: 250},
                supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
            },
            false);
            
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
