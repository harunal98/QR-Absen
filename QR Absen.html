<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Absensi Siswa</title>
    <!-- Library QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md text-center border border-slate-100">
        <h1 class="text-2xl font-bold mb-2 text-slate-800">Absensi Kelas</h1>
        <p class="text-slate-500 text-sm mb-6">Arahkan kamera ke QR Code Siswa</p>
        
        <!-- Frame Kamera -->
        <div id="reader" class="w-full mb-6 overflow-hidden rounded-lg border-2 border-dashed border-slate-300"></div>
        
        <!-- Area Hasil Notifikasi -->
        <div id="result" class="text-lg font-semibold h-12 flex items-center justify-center px-4 rounded-lg bg-slate-100 text-slate-600 transition-all duration-300">
            Kamera siap digunakan...
        </div>
    </div>

    <script>
        // GANTI STRING DI BAWAH DENGAN URL WEB APP GOOGLE APPS SCRIPT-MU
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYBxiWJj5S6xjbTKAouPFaO9eHfhJygGAFj9pXdHS56TpVs2xU02luC8cqW3A2R5TP/exec";

        let isScanning = false;

        function onScanSuccess(decodedText, decodedResult) {
            // Jika sedang memproses data, abaikan scan agar tidak dobel
            if (isScanning) return; 
            isScanning = true;

            const resultDiv = document.getElementById('result');
            
            // UI Loading state
            resultDiv.className = "text-lg font-semibold h-12 flex items-center justify-center px-4 rounded-lg bg-yellow-100 text-yellow-700 transition-all duration-300";
            resultDiv.innerHTML = `Memproses NIS: ${decodedText}...`;

            // Kirim data ke API Google Sheets
            fetch(`${SCRIPT_URL}?nis=${encodeURIComponent(decodedText)}`)
                .then(async response => {
                    const responseText = await response.text();
                    let data;

                    try {
                        data = JSON.parse(responseText);
                    } catch (error) {
                        throw new Error("Respons server bukan JSON yang valid.");
                    }

                    if (!response.ok || data.status === "error") {
                        throw new Error(data.message || `Server mengembalikan HTTP ${response.status}.`);
                    }

                    return data;
                })
                .then(data => {
                    if (data.status === "success") {
                        // Jika berhasil (Nama ditemukan dan dicatat)
                        resultDiv.className = "text-lg font-semibold h-12 flex items-center justify-center px-4 rounded-lg bg-emerald-100 text-emerald-700 transition-all duration-300 shadow-sm";
                        resultDiv.innerHTML = `✅ ${data.message}`;
                    } else {
                        // Jika gagal (NIS tidak ada di database)
                        resultDiv.className = "text-lg font-semibold h-12 flex items-center justify-center px-4 rounded-lg bg-red-100 text-red-700 transition-all duration-300";
                        resultDiv.innerHTML = `❌ ${data.message}`;
                    }
                    
                    // Jeda 3.5 detik sebelum kamera siap nge-scan siswa berikutnya
                    setTimeout(() => {
                        resultDiv.className = "text-lg font-semibold h-12 flex items-center justify-center px-4 rounded-lg bg-slate-100 text-slate-600 transition-all duration-300";
                        resultDiv.innerHTML = "Kamera siap digunakan...";
                        isScanning = false;
                    }, 3500);
                })
                .catch(error => {
                    resultDiv.className = "text-lg font-semibold h-12 flex items-center justify-center px-4 rounded-lg bg-red-100 text-red-700 transition-all duration-300";
                    resultDiv.textContent = error.message.includes("Respons server")
                        ? "Server error: cek konfigurasi Google Sheets."
                        : error.message;
                    setTimeout(() => {
                        isScanning = false;
                    }, 3500);
                });
        }

        function onScanFailure(error) {
            // Tidak perlu log error terus-menerus karena library akan terus mencoba membaca frame
        }

        // Inisialisasi konfigurasi scanner
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { 
                fps: 10, 
                qrbox: {width: 250, height: 250},
                supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
            },
            false);
            
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
